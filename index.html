<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample HTML Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f8fafc;
      color: #1f2937;
    }

    header {
      background-color: #2563eb;
      color: white;
      padding: 16px;
      text-align: center;
    }

    main {
      padding: 24px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      margin: auto;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <h1>Welcome to My Sample Page</h1>
    <p>Simple HTML + CSS example</p>
  </header>

  <main>
    <div class="card">
      <h2>Hello 👋</h2>
      <p>
        This is a basic sample HTML page. You can use it for:
      </p>
      <ul>
        <li>GitHub Pull Request demo</li>
        <li>Frontend testing</li>
        <li>Learning HTML & CSS</li>
      </ul>

      <button onclick="showMessage()">Click Me</button>
    </div>
  </main>

  <footer>
    © 2026 Sample Project
  </footer>

  <script>
    function showMessage() {
      alert("Button clicked successfully!");
    }
  </script>

</body>
</html>
